<!DOCTYPE html>
<html lang="en">
<head>
  <title>FRAMS - Attendance Management</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style1.css">
  <link href="https://fonts.googleapis.com/css?family=Baloo+Bhai|Bree+Serif&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Navbar Styling */
    #navbar {
      display: flex;
      align-items: center;
      position: sticky;
      top: 0px;
      background-color: #2d3e50;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    #logo {
      margin: 10px 34px;
    }

    #logo img {
      height: 69px;
      border-radius: 50%;
    }

    #navbar ul {
      display: flex;
      list-style: none;
      margin-left: auto;
    }

    #navbar ul li {
      font-size: 1.3rem;
      padding: 0 10px;
    }

    #navbar ul li a {
      color: white;
      display: block;
      padding: 8px 20px;
      border-radius: 20px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    #navbar ul li a:hover {
      color: #2d3e50;
      background-color: white;
    }

    /* Home Section */
    #home {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 600px;
      background: url("{{url_for('static',filename='bg1.jpg')}}") no-repeat center center/cover;
      background-blend-mode: overlay;
      background-color: rgba(0, 0, 0, 0.4);
      color: white;
      padding: 3% 10%;
      text-align: center;
    }

    #home h1 {
      font-family: 'Bree Serif', serif;
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    #home p {
      font-family: 'Bree Serif', serif;
      font-size: 1.5rem;
      margin-bottom: 30px;
    }

    .btn {
      padding: 10px 30px;
      border: none;
      background-color: #ff7e5f;
      color: white;
      margin: 10px;
      font-size: 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #feb47b;
    }

    /* Contact Section */
    #contact {
      position: relative;
      padding: 50px 0;
      background-color: #f9f9f9;
      background: url("{{url_for('static',filename='contact-bg.jpg')}}") no-repeat center center/cover;
      background-blend-mode: overlay;
      background-color: rgba(0, 0, 0, 0.5);
    }

    #contact h1 {
      color: white;
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    #contact-box {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    #contact-box form {
      background-color: rgba(255, 255, 255, 0.8);
      padding: 30px;
      border-radius: 10px;
      width: 60%;
      max-width: 600px;
    }

    #contact-box input,
    #contact-box textarea {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      font-size: 1.2rem;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    #contact-box button {
      background-color: #ff7e5f;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #contact-box button:hover {
      background-color: #feb47b;
    }

    footer {
      background-color: #2d3e50;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1rem;
    }

    /* Utility classes */
    .h-primary {
      font-size: 3.5rem;
      padding: 12px;
      font-family: 'Bree Serif', serif;
    }

    .h-secondary {
      font-size: 2.3rem;
      padding: 12px;
      font-family: 'Bree Serif', serif;
    }
  </style>
</head>
<body>
  <nav id="navbar">
    
    <ul>
      <li class="item"><a href="#home">Home</a></li>
      <li class="item"><a href="#contact">Contact Us</a></li>
      <li class="item"><a href="/how">Admin Login</a></li>
    </ul>
  </nav>  

  <section id="home">
    <h1>Face Recognition based Attendance Management System</h1>
    <p>Manage your students' attendance effortlessly with state-of-the-art facial recognition technology.</p>
    <form action="/new" method="POST">
      <button type="submit" class="btn">Register New Student</button>
    </form>
    <form action="reco" method="post">
      <button type="submit" class="btn">Punch Your Attendance</button>
    </form>
  </section>

  <section id="contact">
    <h1>Contact Us</h1>
    <div id="contact-box">
      <form action="https://formspree.io/xjvapqwa" method="POST">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" name="name" id="name" placeholder="Enter Your Name">
        </div>
        <div class="form-group">
          <label for="e-mail">E-mail:</label>
          <input type="text" name="name" id="e-mail" placeholder="Enter Your E-mail">
        </div>
        <div class="form-group">
          <label for="phone">Contact No:</label>
          <input type="number" name="name" id="phone" placeholder="Enter Your Contact Number">
        </div>
        <div class="form-group">
          <label for="message">Feedback:</label>
          <textarea name="message" id="message" cols="10" rows="5" placeholder="Your Feedback is valuable. Please write to us."></textarea>
        </div>
        <button type="submit" name="submit">Submit</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Malik Haider Nawaz. All rights reserved!</p>
  </footer>
</body>
</html>
